- name: education-retention-angle
  input:
    message: "What should our student-facing messaging emphasize to reduce mid-program dropout?"
  fixture_document: "education_online_courses.txt"
  expect:
    # Not "deadline" - the first real run correctly emphasized the live
    # cohort/accountability angle instead of the specific "falling behind
    # on weekly deadlines" framing - "cohort" is the more robust anchor,
