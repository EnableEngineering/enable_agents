  expect:
    json_keys: ["industry", "sector", "function", "role", "target_audience", "value_proposition", "tone", "key_themes"]
    # Not "retail" - the analyzer legitimately classifies this as
    # "E-commerce" (also correct; this doc's actual sales channel is
    # direct-to-consumer online), caught by the first real run of this
    # suite. "Home Goods" is the product category either classification
    # would still have to mention.
    keywords: ["Home Goods"]

