# Fixtures for DomainSpecializationAnalyzer.analyze_documents() (backend/app.py:875),
# fired automatically by POST /api/content-marketing/documents/upload.
#
# Only 7 cases, not 10-15: this function's entire input is "which document,"
# and there are exactly 7 industries in the analyzer's own industry_keywords
# dict (backend/app.py:865-873) - one real, distinct document per industry is
# a more meaningful eval than padding to 10-15 with near-duplicate content.
# Documented deviation from the general 10-15-per-function target, not an
# oversight.
#
# expect.keywords are checked against the combined text of every string
# value in the response JSON (industry/sector/function/role/etc.), not a
# single field - the analyzer's own wording varies run to run at temperature=0
# but the underlying classification shouldn't.

- name: manufacturing-capability-statement
  fixture_document: "manufacturing_capability.txt"
  expect:
    json_keys: ["industry", "sector", "function", "role", "target_audience", "value_proposition", "tone", "key_themes"]
    keywords: ["manufactur"]

