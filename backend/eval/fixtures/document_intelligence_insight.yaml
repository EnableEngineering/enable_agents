# Fixtures for DocumentService.get_document_insight() (backend/agents/document_intelligence/service.py:694),
# GET /api/document-intelligence/documents/<id>/insight.
#
# Same "one real case per document" rationale as analyze_documents.yaml:
# this endpoint takes no query, just a document_id - there's no way to get
# 10-15 non-redundant cases out of one document, so this uses all 7 fixture
# documents once each. expect.keywords are checked against summary +
# keyFacts joined together.

- name: manufacturing-insight
  fixture_document: "manufacturing_capability.txt"
  expect:
    json_keys: ["status", "summary", "keyFacts", "recommendations", "sources"]
    keywords: ["CNC"]

