# Fixtures for generate_content_marketing() (backend/app.py:6035),
# POST /api/content-marketing/generate-content.
#
# Each case needs a CMProject with the named fixture_document already
# uploaded (the runner handles creating one project per fixture_document
# and uploading it once, then reuses it across every case referencing that
# document - see runner.py). expect.keywords are checked against the
# generated `content` field.

- name: manufacturing-linkedin-post
  input:
    channel: "linkedin"
    content_type: "post"
    context: "Announce our CNC capacity expansion to attract new automotive customers."
  fixture_document: "manufacturing_capability.txt"
  expect:
    keywords: ["CNC"]

