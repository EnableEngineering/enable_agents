name: Backend Tests (local-preview)

# local-preview is the branch production is deployed from, and ci.yml
# intentionally doesn't run on pushes to it (frontend lint/build/e2e are too
# heavy per push). This runs only the fast-to-reason-about part - the backend
# suite - so a push to the deploy branch can't silently break it.

on:
  push:
    branches: [local-preview]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: enable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/enable_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
        run: python -m pytest tests/sanity tests/integration -v
