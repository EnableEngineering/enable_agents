# Host-level nginx config for https://agents.enableyou.co/ - THE REAL ONE.
#
# Pulled into version control 2026-09-16 after it caused a real production
# bug: this file previously existed ONLY on the VM at
# /etc/nginx/sites-enabled/agents.conf, hand-edited over time with no
# review trail. A new backend route (/assistant_chat, the global AI
# Assistant panel's endpoint) was added to app.py but never added to this
# file's whitelist regex below - every chat request 405'd in production
# for as long as that feature existed there, silently, until a user
# noticed. See docs/deploy.md's "How the frontend is actually served"
# section for the full story (this file is also what serves the frontend
# as static files from /var/www/enable_agents - NOT the frontend-remote
# Docker container, which docker-compose.yml still defines but which this
# config never proxies to).
#
# Source of truth going forward: edit THIS file, then deploy it to the VM
# (see docs/deploy.md's "Sync nginx config" step) - don't hand-edit the VM
# copy and let it drift again.
#
# ⚠️ If you add a new non-/api/-prefixed, non-/auth/-prefixed Flask route
# in backend/app.py, you MUST add it to the whitelist regex below or it
# will silently 405 in production (falls through to the SPA static-file
# handler instead of reaching the backend). This allow-list pattern is
# fragile by construction - worth considering replacing it with something
# that fails safe (e.g. proxy everything not matching a static-asset
# extension to the backend, instead of the other way around) rather than
# fixing it route-by-route forever.

# Two backend containers (docker-compose.yml: backend-remote on :8000,
# backend-remote-b on :8001). Requests are spread across both.
#   * Planned restarts (scripts/deploy_remote.sh): the backend is DRAINED first -
#     `down` is added to its line below (scripts/nginx_backend_state.sh) and nginx
#     reloaded gracefully - so no request is ever sent to a backend that is about
#     to stop or is still starting.
#   * Unplanned failures: max_fails/fail_timeout take a dead backend out of
#     rotation, and proxy_next_upstream (in the server block) retries the request
#     on the other one. fail_timeout is deliberately short: with only two servers,
#     a recovered backend that stayed "failed" for long would leave nothing in
#     rotation if the other one failed in that window.
# If backend-remote-b isn't running at all, its refused connections are simply
# retried on :8000. Keep each `server` line in this exact shape - the drain
# script edits it with sed.
upstream enable_agents_backend {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=3s;
}

server {
    server_name agents.enableyou.co;

    # A refused/failed connection or a 502/503 from one backend is retried once
    # on the other. nginx never retries a non-idempotent request (POST) that
    # already reached a backend, so this can't double-submit anything.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # Give up on a backend that won't accept a connection after 3s (default 60s) so
    # the retry above happens quickly. Refused connections fail instantly anyway.
    proxy_connect_timeout 3s;

    root /var/www/enable_agents;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Legacy non-/api-prefixed backend routes (auth + assorted agent
    # endpoints written before the /api/ convention). Proxied explicitly
    # since they don't match the /api/ or /auth/ prefixes below and would
    # otherwise fall through to the SPA static handler (404/405).
    location ~ ^/(health|ready|assistant_chat|upload|send-bulk-emails|generate-requirements|save-requirements|search-google-businesses|connect-google-business|get-google-business-data|get-requirements-with-google-data|scrape|scrape_product_info|debug_scrape|simple_search|rag_test|chat_api|enterprise_chat|extract-with-kg-rag|clear-kg-rag-cache|kg-rag-cache-status|recommend_agents|save_json_file|load_json_file|file_to_json_convert|check_existing_file|save-prompt|previous-prompts|get_user_favorites|save_user_favorite|remove_user_favorite|search_suggestions|export-google-sheet|test-connection|chrome_history|chrome_status|enrich_with_openai|get_tools_landscape|yfinance|AI_ML|Jobs|Location|Logistics|Messaging|News|Transportation|Weather)$ {
        proxy_pass http://enable_agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }


    # /login and /register are dual-purpose: the React SPA owns them as
    # client-side page routes (GET - including the Google OAuth callback
    # redirect target, which lands here with ?google_auth=success&... for
    # the frontend to read), while the backend owns them as POST-only auth
    # APIs. Only proxy POST; let GET fall through to the SPA.
    location = /login {
        if ($request_method = POST) {
            proxy_pass http://enable_agents_backend;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        try_files $uri /index.html;
    }

    location = /register {
        if ($request_method = POST) {
            proxy_pass http://enable_agents_backend;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        try_files $uri /index.html;
    }

    # Bulk email enrichment can run several serial per-business lookups
    # (scrap.io + a website scrape) within one request - give it more
    # headroom than the default 60s before nginx gives up and returns its
    # own HTML error page in place of the backend's JSON response.
    location = /api/enrich-businesses-with-emails {
        proxy_pass http://enable_agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # Proxy to backend container
    location /api/ {
        proxy_pass http://enable_agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://enable_agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Bare (non-/api/) email-sending routes - same reason as the big
    # regex block above, added separately since it is a path prefix
    # (/emails/send_via_gmail) rather than a single top-level segment.
    location /emails/ {
        proxy_pass http://enable_agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve React index.html for all routes (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agents.enableyou.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agents.enableyou.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = agents.enableyou.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name agents.enableyou.co;
    return 404; # managed by Certbot


}
