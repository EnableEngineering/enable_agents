# yaml-language-server: $schema=https://json.schemastore.org/docker-compose.json
# Re-run / port cleanup: when adding container_name entries, sync ENABLE_AGENTS_CONTAINERS in scripts/run.sh
services:

  # --- Infrastructure (always-on, no profile)

  postgres:
    image: pgvector/pgvector:pg16
    container_name: enable_agents_postgres
    environment:
      POSTGRES_DB: enable_agents
      POSTGRES_USER: enable_agents
      POSTGRES_PASSWORD: enable_agents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - enable-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enable_agents -d enable_agents"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: enable_agents_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - enable-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Development profile

  # Use either profile dev OR prod (not both): both publish host port 8000 for the API.
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_backend_dev
    command: flask run --host=0.0.0.0 --port=8000 --debug --reload
    ports:
      - "8000:8000"
      - "5000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    # OAuth redirects use port 5000 (host ports 8000 and 5000 forward to container 8000).
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      FLASK_DEBUG: 1
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: development
      PUBLIC_URL: "http://localhost:8000"
      GOOGLE_REDIRECT_URI: "http://localhost:5000/auth/google/callback"
      LINKEDIN_REDIRECT_URI: "http://localhost:5000/auth/linkedin/callback"
      FRONTEND_URL: "http://localhost:3000"
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s
    restart: unless-stopped
    networks:
      - enable-network

  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: enable_agents_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      REACT_APP_API_URL: "http://localhost:8000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  celery-worker-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_celery_dev
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  celery-beat-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_beat_dev
    command: celery -A core.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  flower:
    profiles: ["dev"]
    image: mher/flower:2.0
    container_name: enable_agents_flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - enable-network

  redis-commander:
    profiles: ["dev"]
    # GHCR image is multi-arch (arm64 and amd64) for Apple Silicon.
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: enable_agents_redis_commander
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - enable-network

  # --- Production profile

  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_backend
    command: >
      gunicorn "app:app" --bind 0.0.0.0:8000 --workers 4 --timeout 120
      --preload -c /app/gunicorn_conf.py
      --access-logfile - --error-logfile - --log-level info --capture-output
    env_file:
      - .env.docker
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      PUBLIC_URL: "http://localhost:8000"
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/instance:/app/instance
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network
    healthcheck:
      # App imports are heavy; workers need >30s on small VMs — avoid false "unhealthy"
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--connect-timeout",
          "5",
          "--max-time",
          "15",
          # /ready, not /health: "healthy" must mean the database answers and is
          # migrated to this build's revision, not just "process is up".
          "http://127.0.0.1:8000/ready",
        ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 180s

  celery-worker:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_celery
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  celery-beat:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_beat
    command: celery -A core.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "http://localhost:8000"
    container_name: enable_agents_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # --- Remote profile (nginx reverse proxy for GCP/AWS/etc.)

  backend-remote: &backend_remote
    profiles: ["remote"]
    # A restart (deploy) lets gunicorn finish in-flight requests - AI calls can
    # take a minute - before Docker kills it (default grace is only 10s).
    stop_grace_period: 75s
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_backend_remote
    command: >
      gunicorn "app:app" --bind 0.0.0.0:8000 --workers 4 --timeout 120 --graceful-timeout 70
      --preload -c /app/gunicorn_conf.py
      --access-logfile - --error-logfile - --log-level info --capture-output
    env_file:
      - .env.docker
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - backend_instance:/app/instance
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Publish 8000 on host so ./scripts/run.sh can curl /health (prod backend does the same)
      - "8000:8000"
    networks:
      enable-network:
        aliases:
          - backend
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--connect-timeout",
          "5",
          "--max-time",
          "15",
          # /ready, not /health: "healthy" must mean the database answers and is
          # migrated to this build's revision, not just "process is up".
          "http://127.0.0.1:8000/ready",
        ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 180s

  # Second copy of the backend, on host port 8001. Host nginx load-balances
  # across 8000 and 8001 (deploy/nginx/host-agents.enableyou.co.conf), and
  # scripts/deploy_remote.sh restarts them one at a time - so a deploy never
  # leaves nothing serving. It shares everything with backend-remote except
  # the container name, host port, network alias and worker count.
  backend-remote-b:
    <<: *backend_remote
    container_name: enable_agents_backend_remote_b
    command: >
      gunicorn "app:app" --bind 0.0.0.0:8000 --workers ${BACKEND_B_WORKERS:-2} --timeout 120 --graceful-timeout 70
      --preload -c /app/gunicorn_conf.py
      --access-logfile - --error-logfile - --log-level info --capture-output
    ports:
      - "8001:8000"
    networks:
      enable-network:
        aliases:
          - backend-b

  celery-worker-remote:
    profiles: ["remote"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_celery_remote
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  celery-beat-remote:
    profiles: ["remote"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enable_agents_beat_remote
    command: celery -A core.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: "postgresql+psycopg2://enable_agents:enable_agents@postgres:5432/enable_agents"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  frontend-remote:
    profiles: ["remote"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "${PUBLIC_URL:-http://localhost}"
    container_name: enable_agents_frontend_remote
    depends_on:
      backend-remote:
        condition: service_started
    restart: unless-stopped
    networks:
      enable-network:
        aliases:
          - frontend
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  nginx:
    profiles: ["remote"]
    image: nginx:alpine
    container_name: enable_agents_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      frontend-remote:
        condition: service_healthy
      backend-remote:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enable-network

  certbot:
    profiles: ["certbot"]
    image: certbot/certbot
    container_name: enable_agents_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - enable-network

volumes:
  postgres_data:
  frontend_node_modules:
  backend_instance:
  backend_data:
  certbot_www:
  certbot_certs:

networks:
  enable-network:
    driver: bridge
